[project]
name = "energy-demand-forecast"
version = "0.1.0"
description = "Day-ahead probabilistic forecasting of Great Britain electricity demand, benchmarked against the grid operator"
readme = "README.md"
authors = [{ name = "Nipuna Lakruwan" }]
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.109",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
